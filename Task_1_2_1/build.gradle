plugins {
    id 'java'
    id 'jacoco'
    id 'application'
}

application {
    mainClass = 'ru.nsu.kagaya.task121.Main'
}


group = 'ru.nsu.kagaya.Task_1_2_1'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jacocoTestReport {
    reports {
        xml.required = true
    }
}